<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Register - Material Calculator</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0891b2 0%, #0e7490 100%);
      padding: 20px;
    }
    
    .auth-card {
      background: white;
      border-radius: 8px;
      padding: 48px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      width: 100%;
    }
    
    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .auth-logo img {
      max-width: 200px;
      height: auto;
    }
    
    .auth-title {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
      text-align: center;
    }
    
    .auth-subtitle {
      color: #718096;
      text-align: center;
      margin-bottom: 32px;
      font-size: 14px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-label {
      display: block;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 4px;
      font-size: 16px;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    
    .form-input:focus {
      outline: none;
      border-color: #0891b2;
    }
    
    .btn-auth {
      width: 100%;
      padding: 14px;
      background: #0891b2;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .btn-auth:hover {
      background: #0e7490;
    }
    
    .btn-auth:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    
    .auth-link {
      text-align: center;
      margin-top: 24px;
      color: #718096;
    }
    
    .auth-link a {
      color: #0891b2;
      text-decoration: none;
      font-weight: 600;
    }
    
    .auth-link a:hover {
      text-decoration: underline;
    }
    
    .error-message {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px 16px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    
    .success-message {
      background: #d1fae5;
      color: #065f46;
      padding: 12px 16px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    
    .password-hint {
      font-size: 12px;
      color: #718096;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="logo.jpg" alt="Ashley River Roofing">
      </div>
      
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Only approved @ashleyriverroofing.com emails can register</p>
      
      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>
      
      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input 
            type="text" 
            id="name" 
            class="form-input" 
            placeholder="John Doe"
            required
            autocomplete="name"
          >
        </div>
        
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="your@ashleyriverroofing.com"
            required
            autocomplete="email"
          >
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="Create a password"
            required
            autocomplete="new-password"
            minlength="8"
          >
          <div class="password-hint">At least 8 characters</div>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            class="form-input" 
            placeholder="Confirm your password"
            required
            autocomplete="new-password"
          >
        </div>
        
        <button type="submit" class="btn-auth">Create Account</button>
      </form>
      
      <div class="auth-link">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>
  
  <script>
    const form = document.getElementById('registerForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      // Validation
      if (password !== confirmPassword) {
        errorMessage.textContent = 'Passwords do not match';
        errorMessage.style.display = 'block';
        successMessage.style.display = 'none';
        return;
      }
      
      if (password.length < 8) {
        errorMessage.textContent = 'Password must be at least 8 characters';
        errorMessage.style.display = 'block';
        successMessage.style.display = 'none';
        return;
      }
      
      // Disable form
      form.querySelectorAll('input, button').forEach(el => el.disabled = true);
      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';
      
      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          console.log('Registration response:', data);
          // Display the full message (includes hash)
          successMessage.innerHTML = '<div style="font-size: 14px; line-height: 1.6;">' + data.message.replace(/\n/g, '<br>') + '</div>';
          successMessage.style.display = 'block';
          
          // Don't redirect - let them copy the hash
        } else {
          errorMessage.textContent = data.message || 'Registration failed';
          errorMessage.style.display = 'block';
          form.querySelectorAll('input, button').forEach(el => el.disabled = false);
        }
      } catch (err) {
        errorMessage.textContent = 'Network error. Please try again.';
        errorMessage.style.display = 'block';
        form.querySelectorAll('input, button').forEach(el => el.disabled = false);
      }
    });
  </script>
</body>
</html>
